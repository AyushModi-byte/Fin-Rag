index: {version: v1, dir: .cache/index, collection: finrag_chunks, shard_size: 500, protected_versions: [v1]}
reindex: {max_hours: 2.0, probe_chunks: 60}
lexical: {stopwords: en, tokenizer: v1, stem: false}
embeddings: {model: BAAI/bge-small-en-v1.5, batch_size: 1, sort_by_length: true, threads: null, query_prefix: "", doc_prefix: ""}
chunking: {child_tokens: 300, overlap_tokens: 40, max_embed_tokens: 480, min_tokens: 15, max_header_rows: 3, max_heading_chars: 80, context_prefix: true}
retrieval: {top_k: 20, rrf_k: 60, dense_weight: 1.0, bm25_weight: 1.0, use_router_filter: true, min_chunk_tokens: 15}
rerank: {enabled: false, model: Xenova/ms-marco-MiniLM-L-6-v2, top_n: 5}
llm:
  # Groq gpt-oss-120b (console.groq.com/docs/rate-limits, checked 2026-11-10): 30 RPM, 1,000 requests/day,
  # 8,000 tokens/min, 200,000 tokens/day, applied per ORGANIZATION. The 3 keys belong to 3 different accounts,
  # so each key has its own quota and daily_budget (counted per key) is 1,000. Tokens per day are NOT tracked
  # by LLMClient: a 429 citing TPD on a key means that key is done for the day.
  primary: {provider: groq, model: openai/gpt-oss-120b, rpm: 25, daily_budget: 1000, daily_token_budget: 200000, api_key_envs: [GROQ_API_KEY_1, GROQ_API_KEY_2, GROQ_API_KEY_3]}
  fallback: null          # Gemini removed (persistent 503s); a 2nd provider can be added here later
  endpoints:
    gemini: "https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
    groq: "https://api.groq.com/openai/v1/chat/completions"
  temperature: 0
  max_output_tokens: 2048
  key_cooldown_s: 60      # a key that returned 429 is skipped for this long while other keys are fresh
  max_retry_wait_s: 65    # upper bound on one wait, incl. a provider's "try again in" hint
  backoff_base_s: 2.0     # retry waits: base * 2**attempt
  timeout_s: 30
  max_retries: 2          # per provider, with exponential backoff, then switch provider
  cache_dir: .cache/llm
  budget_warn_ratio: 0.8  # stop and tell the user at 80% of a daily budget
generation: {expand_tables: false, max_context_tokens: 4000, prompt_version: grounded_v1}
cache: {enabled: true, threshold: 0.95, path: .cache/semantic_cache.json, version: 2}   # bump version when the result format or citation parser changes
acl: {default: "*", users: {}}   # users: {alice: [Adobe, 3M]}; "*" = every company
api:
  host: 127.0.0.1
  port: 8000
  max_question_chars: 2000
  cors_origins: []                    # browser origins allowed to call the API, e.g. ["https://finrag.vercel.app"]
  cors_origins_env: FINRAG_CORS_ORIGINS   # comma-separated extra origins from the environment (per-deployment)
  api_key_env: FINRAG_API_KEY         # owner key; if set, a request with a valid X-API-Key skips the per-IP limit
  require_api_key: false              # true = private mode: /query answers only callers with the key (fails closed if no key is set)
  trusted_proxy_hops: 1               # proxies in front of the app; the client IP is the Nth entry from the right of X-Forwarded-For (0 = ignore the header)
  log_salt_env: FINRAG_LOG_SALT       # salt for the hashed client label in logs; random per process if unset
  rate_limit: {per_minute: 5, per_day: 40, max_clients: 10000}   # per client IP; max_clients bounds memory
  daily_global_cap: 250               # accepted /query calls per UTC day, all clients; 250 x ~1.4k tokens = ~350k of the 3 x 160k usable Groq tokens
  usage_file: .cache/api_usage.json
eval: {dev_ratio: 0.5, seed: 42, n_companies: 10, min_questions: 50, recall_k: 5, runs_dir: data/eval/runs, judge_max_output_tokens: 4096}
data:
  questions_url: https://raw.githubusercontent.com/patronus-ai/financebench/main/data/financebench_open_source.jsonl
  pdf_url: https://raw.githubusercontent.com/patronus-ai/financebench/main/pdfs/{doc_id}.pdf
  raw_dir: data/raw
  parsed_dir: data/parsed
  log_file: logs/app.log
  eval_dir: data/eval
  timeout_s: 60
